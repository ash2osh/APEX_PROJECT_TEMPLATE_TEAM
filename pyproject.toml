[project]
name = "apex-project-template-team"
version = "0.1.0"
description = "Lightweight APEX team template with explicit deployments and Git-based migrations"
requires-python = ">=3.10"
# The daily team workflow is stdlib-only and deliberately has no runtime dependencies.
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []

[project.optional-dependencies]
# Required only by setup_graphify_apx.py.
graph = ["graphify", "tree-sitter-sql"]
# Optional Python linting.
dev = ["ruff>=0.5"]

[tool.ruff]
target-version = "py310"
line-length = 200
src = ["scripts"]

[tool.ruff.lint]
# F  pyflakes      - undefined names, unused imports (the Task 1 crash class)
# E9 syntax errors
# B  bugbear       - mutable defaults, silent except patterns
# UP unpyupgrade   - keep the 3.10+ idioms consistent
select = ["F", "E9", "B", "UP"]
