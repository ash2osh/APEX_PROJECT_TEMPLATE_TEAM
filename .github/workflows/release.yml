name: release

on:
  push:
    tags:
      - 'schema/v[0-9]+.[0-9]+.[0-9]+'
      - 'app/**/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: example-team-apex-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_slug: ${{ steps.build_archive.outputs.tag_slug }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Build canonical release archive
        id: build_archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^schema/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            cmd_args=(--kind schema --ref "$TAG" --version "$version" --out scratch/release)
          elif [[ "$TAG" =~ ^app/([a-z0-9_-]+)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            alias="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
            cmd_args=(--kind app --alias "$alias" --ref "$TAG" --version "$version" --out scratch/release)
          else
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi
          PYTHONPATH=scripts python3 scripts/team.py build-release "${cmd_args[@]}"
          PYTHONPATH=scripts python3 scripts/team.py verify-release scratch/release/release.tar
          sha256sum scratch/release/release.tar | tee scratch/release/release.sha256
          tag_slug="${TAG//\//-}"
          echo "tag_slug=${tag_slug}" >> "$GITHUB_OUTPUT"
      - name: Upload immutable release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.build_archive.outputs.tag_slug }}
          path: scratch/release/release.tar
          if-no-files-found: error

  test-and-handoff:
    needs: build
    runs-on: [self-hosted, team-apex, test]
    environment: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.tag_slug }}
          path: scratch/release
      - name: Verify downloaded bytes
        run: PYTHONPATH=scripts python3 scripts/team.py verify-release scratch/release/release.tar
      - name: Materialize protected handoff inputs
        env:
          TEAM_TEST_ENV_CONTENT: ${{ secrets.TEAM_TEST_ENV_CONTENT }}
          TEAM_TRUST_KEY_CONTENT: ${{ vars.TEAM_TRUST_KEY_CONTENT }}
          TEAM_PRODUCTION_HISTORY_CONTENT: ${{ vars.TEAM_PRODUCTION_HISTORY_CONTENT }}
        run: |
          test -n "$TEAM_TEST_ENV_CONTENT"
          test -n "$TEAM_TRUST_KEY_CONTENT"
          test -n "$TEAM_PRODUCTION_HISTORY_CONTENT"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test ! -e .env
          test ! -e targets/production.env
          umask 077
          printf '%s\n' "$TEAM_TEST_ENV_CONTENT" > "$RUNNER_TEMP/test.env"
          printf '%s\n' "$TEAM_TRUST_KEY_CONTENT" > "$RUNNER_TEMP/test-trust-key.pem"
          printf '%s\n' "$TEAM_PRODUCTION_HISTORY_CONTENT" > "$RUNNER_TEMP/production-history.json"
          chmod 600 "$RUNNER_TEMP/test.env" "$RUNNER_TEMP/test-trust-key.pem" \
            "$RUNNER_TEMP/production-history.json"
      - name: Apply and qualify the protected test target
        env:
          TEAM_FLOW_RUNNER: ${{ vars.TEAM_FLOW_RUNNER }}
        run: |
          PYTHONPATH=scripts python3 scripts/team.py \
            --env "$RUNNER_TEMP/test.env" run-release-test \
            scratch/release/release.tar --target targets/test.json \
            --out "$RUNNER_TEMP/test-evidence.json"
      - name: Sign test evidence
        # The signing key exists only inside this step, after the evidence is written, so the code
        # that produces the evidence can never read the key that vouches for it.
        env:
          TEAM_TEST_SIGNING_KEY_CONTENT: ${{ secrets.TEAM_TEST_SIGNING_KEY_CONTENT }}
        run: |
          test -n "$TEAM_TEST_SIGNING_KEY_CONTENT"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/test-signing-key.pem"' EXIT
          printf '%s\n' "$TEAM_TEST_SIGNING_KEY_CONTENT" > "$RUNNER_TEMP/test-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/test-signing-key.pem"
          PYTHONPATH=scripts python3 scripts/team.py sign-test-evidence \
            --evidence "$RUNNER_TEMP/test-evidence.json" \
            --archive scratch/release/release.tar \
            --private-key "$RUNNER_TEMP/test-signing-key.pem" \
            --out "$RUNNER_TEMP/test-evidence.sig"
      - name: Generate the production handoff from signed evidence
        run: |
          PYTHONPATH=scripts python3 scripts/team.py gen-runbook scratch/release/release.tar \
            --history "$RUNNER_TEMP/production-history.json" --target targets/production.json \
            --test-evidence "$RUNNER_TEMP/test-evidence.json" \
            --signature "$RUNNER_TEMP/test-evidence.sig" \
            --trust-key "$RUNNER_TEMP/test-trust-key.pem" --out scratch/PRODUCTION_RUNBOOK.md
          test -s scratch/PRODUCTION_RUNBOOK.md
      - name: Remove protected handoff inputs
        if: always()
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type f \
            \( -name test.env -o -name test-signing-key.pem \
               -o -name test-trust-key.pem -o -name production-history.json \) \
            -delete
      - name: Retain test qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-qualification-${{ needs.build.outputs.tag_slug }}
          path: |
            ${{ runner.temp }}/test-evidence.json
            ${{ runner.temp }}/test-evidence.sig
          if-no-files-found: warn
      - name: Retain offline production handoff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-handoff-${{ needs.build.outputs.tag_slug }}
          path: scratch/PRODUCTION_RUNBOOK.md
          if-no-files-found: error
