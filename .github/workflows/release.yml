name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build canonical release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          PYTHONPATH=scripts python3 scripts/team.py build-release --ref "$TAG" --version "$version" --out scratch/release
          PYTHONPATH=scripts python3 scripts/team.py verify-release scratch/release/release.tar
          sha256sum scratch/release/release.tar | tee scratch/release/release.sha256
      - name: Upload immutable release bytes
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: scratch/release/release.tar
          if-no-files-found: error

  test-and-handoff:
    needs: build
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the signed-handoff verification dependency
        run: |
          # The promotion handoff verifies a detached Ed25519 signature over
          # the v2 evidence emitted and signed below.
          python3 -m pip install --quiet 'cryptography>=41'
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: scratch/release
      - name: Verify downloaded bytes
        run: PYTHONPATH=scripts python3 scripts/team.py verify-release scratch/release/release.tar
      - name: Require protected test binding and handoff configuration
        env:
          TEAM_TEST_ENV_FILE: ${{ vars.TEAM_TEST_ENV_FILE }}
          TEAM_TEST_HISTORY_JSON: ${{ vars.TEAM_TEST_HISTORY_JSON }}
          TEAM_APP_ALIASES: ${{ vars.TEAM_APP_ALIASES }}
          TEAM_TRUST_KEY: ${{ vars.TEAM_TRUST_KEY }}
          TEAM_PRODUCTION_HISTORY_JSON: ${{ vars.TEAM_PRODUCTION_HISTORY_JSON }}
          TEAM_TEST_SIGNING_KEY_CONTENT: ${{ secrets.TEAM_TEST_SIGNING_KEY_CONTENT }}
        run: |
          test -n "$TEAM_TEST_ENV_FILE" && test -f "$TEAM_TEST_ENV_FILE"
          test -n "$TEAM_TEST_HISTORY_JSON" && test -f "$TEAM_TEST_HISTORY_JSON"
          test -n "$TEAM_APP_ALIASES"
          test -n "$TEAM_TRUST_KEY" && test -f "$TEAM_TRUST_KEY"
          test -n "$TEAM_PRODUCTION_HISTORY_JSON" && test -f "$TEAM_PRODUCTION_HISTORY_JSON"
          test -n "$TEAM_TEST_SIGNING_KEY_CONTENT"
          test ! -e .env
          test ! -e targets/production.env
      - name: Plan the downloaded artifact for the test target
        env:
          TEAM_TEST_HISTORY_JSON: ${{ vars.TEAM_TEST_HISTORY_JSON }}
        run: |
          PYTHONPATH=scripts python3 scripts/team.py plan-release scratch/release/release.tar \
            --history "$TEAM_TEST_HISTORY_JSON" --target targets/test.json --out scratch/test-plan.json
      - name: Apply only the verified artifact to non-production test
        env:
          TEAM_TEST_ENV_FILE: ${{ vars.TEAM_TEST_ENV_FILE }}
          TEAM_TEST_HISTORY_JSON: ${{ vars.TEAM_TEST_HISTORY_JSON }}
        run: |
          scripts/apply_release.sh scratch/release/release.tar \
            --plan scratch/test-plan.json --history "$TEAM_TEST_HISTORY_JSON" \
            --target targets/test.json --env "$TEAM_TEST_ENV_FILE" \
            --out "$RUNNER_TEMP/apply-report.json"
      - name: Qualify the persistent test target
        env:
          TEAM_TEST_ENV_FILE: ${{ vars.TEAM_TEST_ENV_FILE }}
          TEAM_APP_ALIASES: ${{ vars.TEAM_APP_ALIASES }}
        run: |
          PYTHONPATH=scripts python3 scripts/team.py --env "$TEAM_TEST_ENV_FILE" qualify-target \
            --source-commit "$GITHUB_SHA" \
            --aliases "$TEAM_APP_ALIASES" \
            --release-archive scratch/release/release.tar \
            --apply-report "$RUNNER_TEMP/apply-report.json" \
            --out "$RUNNER_TEMP/test-evidence.json"
      - name: Materialize the protected test signing key
        env:
          TEAM_TEST_SIGNING_KEY_CONTENT: ${{ secrets.TEAM_TEST_SIGNING_KEY_CONTENT }}
        run: |
          umask 077
          printf '%s\n' "$TEAM_TEST_SIGNING_KEY_CONTENT" > "$RUNNER_TEMP/test-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/test-signing-key.pem"
      - name: Sign test evidence
        run: |
          PYTHONPATH=scripts python3 scripts/team.py sign-test-evidence \
            --evidence "$RUNNER_TEMP/test-evidence.json" \
            --private-key "$RUNNER_TEMP/test-signing-key.pem" \
            --out "$RUNNER_TEMP/test-evidence.sig"
      - name: Generate the production handoff from signed evidence
        env:
          TEAM_PRODUCTION_HISTORY_JSON: ${{ vars.TEAM_PRODUCTION_HISTORY_JSON }}
          TEAM_TRUST_KEY: ${{ vars.TEAM_TRUST_KEY }}
        run: |
          PYTHONPATH=scripts python3 scripts/team.py gen-runbook scratch/release/release.tar \
            --history "$TEAM_PRODUCTION_HISTORY_JSON" --target targets/production.json \
            --test-evidence "$RUNNER_TEMP/test-evidence.json" \
            --signature "$RUNNER_TEMP/test-evidence.sig" \
            --trust-key "$TEAM_TRUST_KEY" --out scratch/PRODUCTION_RUNBOOK.md
          test -s scratch/PRODUCTION_RUNBOOK.md
      - name: Remove the signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/test-signing-key.pem"
      - name: Retain test qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-qualification-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/apply-report.json
            ${{ runner.temp }}/test-evidence.json
            ${{ runner.temp }}/test-evidence.sig
          if-no-files-found: warn
      - name: Retain offline production handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-handoff-${{ github.ref_name }}
          path: scratch/PRODUCTION_RUNBOOK.md
          if-no-files-found: error
