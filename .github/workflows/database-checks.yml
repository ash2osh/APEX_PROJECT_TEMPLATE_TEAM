name: database-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the signed-handoff verification dependency
        run: |
          # test_runbook.py exercises real Ed25519 signing. The daily workflow
          # is stdlib-only; this is the one command that needs the promotion extra.
          python3 -m pip install --quiet 'cryptography>=41'
      - name: Required offline qualification
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
          PYTHONPATH=scripts python3 scripts/team.py ci-doctor --contract ci/runner-contract.json

  replay:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate runner environment
        run: |
          if ! command -v sql >/dev/null 2>&1; then
            echo "::error::Oracle SQLcl 26.2.1+ is required for ci-replay. Ensure the runner has SQLcl in PATH or use a qualified self-hosted runner."
            exit 1
          fi
      - name: Replay selected SHA
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # The replay runner refuses to run against a working tree carrying
          # untracked files, so evidence is written outside the checkout.
          mkdir -p "$RUNNER_TEMP/evidence"
          PYTHONPATH=scripts python3 scripts/team.py ci-replay \
            --ref "$SOURCE_SHA" \
            --contract ci/runner-contract.json \
            --provisioner provisioners/docker_pdb.sh \
            --runner ../scripts/ci_replay_runner.py \
            > "$RUNNER_TEMP/evidence/${SOURCE_SHA}.json"
          cat "$RUNNER_TEMP/evidence/${SOURCE_SHA}.json"
      - name: Publish exact-SHA qualification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/${{ github.sha }}.json
          if-no-files-found: error
