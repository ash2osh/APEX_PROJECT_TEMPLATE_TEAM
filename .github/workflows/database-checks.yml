name: template-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Python syntax
        run: |
          python3 -m compileall -q scripts/
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Behavioral tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate the example configuration
        run: |
          PROJECT_ENV_FILE=.env.example bash -c 'source scripts/load_env.sh "$PROJECT_ENV_FILE"'
      - name: JSON and line-ending checks
        run: |
          python3 -c 'import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path("apps").rglob("*.json")]'
          ! grep -RIl $'\r' --include='*.apx' --include='*.sql' --include='*.json' --include='*.sh' --include='*.ps1' .
