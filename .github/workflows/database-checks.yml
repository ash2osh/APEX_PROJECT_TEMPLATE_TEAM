name: database-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Python lint
        run: |
          python3 -m pip install --quiet ruff
          python3 -m ruff check scripts/
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Install the signed-handoff verification dependency
        run: |
          # test_runbook.py exercises real Ed25519 signing. The daily workflow
          # is stdlib-only; this is the one command that needs the promotion extra.
          python3 -m pip install --quiet 'cryptography>=41'
      - name: Required offline qualification
        run: |
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v
          PYTHONPATH=scripts python3 scripts/team.py ci-doctor --contract ci/runner-contract.json
      - name: JSON and line-ending checks
        run: |
          find targets -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null
          ! grep -RIl $'\r' --include='*.apx' --include='*.sql' --include='*.json' --include='*.sh' --include='*.ps1' .
