name: template-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on a pull request cancels its older run; runs on main always finish.
concurrency:
  group: template-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Python syntax
        run: |
          python3 -m compileall -q scripts/ tools/ tests/
      - name: Ruff
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'ruff>=0.5'
          ruff check scripts tools tests
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: ShellCheck (error severity)
        run: shellcheck --severity=error scripts/*.sh
      - name: PowerShell parse
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path scripts -Filter '*.ps1')
          if ($files.Count -eq 0) { Write-Host 'no scripts/*.ps1 found'; exit 1 }
          $bad = 0
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($problem in $errors) {
              Write-Host ('{0}:{1}: {2}' -f $file.FullName, $problem.Extent.StartLineNumber, $problem.Message)
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Behavioral tests
        env:
          CI_TEST_JOBS: '4'
          CI_FORBID_SKIP: 'PowerShell .*(not installed|required)|needs PowerShell|requires PowerShell|no PowerShell found'
        run: python3 scripts/ci_run_tests.py
      - name: Validate the example configuration
        run: |
          PROJECT_ENV_FILE=.env.example bash -c 'source scripts/load_env.sh "$PROJECT_ENV_FILE"'
      - name: JSON and line-ending checks
        run: |
          python3 -c 'import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path("apps").rglob("*.json")]'
          ! grep -RIl $'\r' --include='*.apx' --include='*.sql' --include='*.json' --include='*.sh' --include='*.ps1' .

  # A second Linux run on the newest Python 3.x, beside the required `offline` job (3.10), so that a newer
  # interpreter cannot break the suite unnoticed. It is kept out of a matrix so that `offline` keeps its name.
  offline-latest-python:
    name: offline (latest Python 3.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Python syntax
        run: |
          python3 -m compileall -q scripts/ tools/ tests/
      - name: Install Ruff
        # Lint runs in `offline`. Ruff is installed here only because tests/test_pre_push_check.py runs
        # scripts/pre_push_check.py, which fails without it.
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'ruff>=0.5'
      - name: Behavioral tests
        env:
          CI_TEST_JOBS: '4'
          CI_FORBID_SKIP: 'PowerShell .*(not installed|required)|needs PowerShell|requires PowerShell|no PowerShell found'
        run: python3 scripts/ci_run_tests.py

  graphify:
    name: graphify (pinned set, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up the project-isolated Graphify environment
        # setup_graphify_apx.py builds .venv-graphify from tools/graphify/requirements.txt (the exact pinned set, which
        # needs Python 3.12) and patches it with the project APEXlang extractor, so a pin move that breaks the patch
        # fails here. Its bin directory goes on PATH because the Graphify pipeline tests look for `graphify` there.
        run: |
          python3 scripts/setup_graphify_apx.py
          echo "$GITHUB_WORKSPACE/.venv-graphify/bin" >> "$GITHUB_PATH"
      - name: Graphify tests
        # Only the Graphify test modules run, and none of them may skip: with Graphify installed a skip means the
        # pipeline did not run.
        env:
          CI_FORBID_SKIP: '.*'
        run: python3 scripts/ci_run_tests.py -p 'test_*graphify*.py'

  windows-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Python syntax
        run: python -m compileall -q scripts/ tools/ tests/
      - name: Ruff
        run: |
          python -m pip install --disable-pip-version-check --no-input 'ruff>=0.5'
          ruff check scripts tools tests
      - name: Shell syntax
        shell: bash
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: PowerShell parse
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path scripts -Filter '*.ps1')
          if ($files.Count -eq 0) { Write-Host 'no scripts/*.ps1 found'; exit 1 }
          $bad = 0
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($problem in $errors) {
              Write-Host ('{0}:{1}: {2}' -f $file.FullName, $problem.Extent.StartLineNumber, $problem.Message)
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Use the long form of the temp directory
        # The runner's temp directory is a short 8.3 name (RUNNER~1) that resolve() expands, which broke
        # path comparisons in tests three times. Keep the runner's own (private) directory, with its long name.
        run: |
          @'
          import os
          import pathlib

          long_temp = str(pathlib.Path(os.environ["TEMP"]).resolve())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TEMP={long_temp}\nTMP={long_temp}\n")
          print("TEMP is now", long_temp)
          '@ | python -
      - name: Behavioral tests
        env:
          CI_TEST_JOBS: '2'
          CI_FORBID_SKIP: 'PowerShell .*(not installed|required)|needs PowerShell|requires PowerShell|no PowerShell found'
        run: python scripts/ci_run_tests.py
      - name: Validate the example configuration
        shell: bash
        run: |
          export PROJECT_ENV_FILE=.env.example
          bash -c 'source scripts/load_env.sh "$PROJECT_ENV_FILE"'
      - name: JSON and line-ending checks
        run: |
          @'
          import json
          from pathlib import Path

          for path in Path("apps").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          suffixes = {".apx", ".sql", ".json", ".sh", ".ps1"}
          offenders = [str(path) for path in Path(".").rglob("*")
                       if path.is_file() and path.suffix.lower() in suffixes
                       and b"\r" in path.read_bytes()]
          if offenders:
              raise SystemExit("CRLF files found: " + ", ".join(offenders))
          '@ | python -

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Darwin exclusive directory installation tests
        run: python3 -m unittest discover -s tests -p 'test_directory_install.py' -v
