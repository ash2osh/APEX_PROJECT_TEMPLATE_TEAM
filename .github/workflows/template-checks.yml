name: template-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ASHARIF 2026-11-26: the full matrix (Windows, newest Python, PowerShell 5.1) runs nightly on main;
  # a push to main runs only the Linux, macOS and Graphify jobs, since its pull request already ran everything.
  schedule:
    - cron: '23 2 * * *'

# A newer commit on a pull request cancels its older run; runs on main always finish.
concurrency:
  group: template-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ASHARIF 2026-11-26: decides how much of the matrix a run needs.
  #   full=true  : pull requests that change more than Markdown, the nightly run, a manual run
  #   full=false : a push to main, or a pull request that changes only *.md files
  # Skipped jobs count as passed for required checks; windows-offline below reports the shards' result.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$EVENT" = push ]; then
            full=false
            echo "push to main: its pull request ran the full matrix; Windows and the newest Python run nightly"
          elif [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            printf 'changed files:\n%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then
              full=false
              echo "only Markdown changed: running the Linux suite (it includes the documentation checks), skipping the rest"
            fi
          fi
          echo "full=$full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Python syntax
        run: |
          python3 -m compileall -q scripts/ tools/ tests/
      - name: Ruff
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'ruff>=0.5'
          ruff check scripts tools tests
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: ShellCheck (error severity)
        run: shellcheck --severity=error scripts/*.sh
      - name: PowerShell parse
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path scripts -Filter '*.ps1')
          if ($files.Count -eq 0) { Write-Host 'no scripts/*.ps1 found'; exit 1 }
          $bad = 0
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($problem in $errors) {
              Write-Host ('{0}:{1}: {2}' -f $file.FullName, $problem.Extent.StartLineNumber, $problem.Message)
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Shared core files match APEX_TEMPLATE_CORE
        run: |
          git clone --quiet --filter=blob:none https://github.com/ash2osh/APEX_TEMPLATE_CORE.git "$RUNNER_TEMP/core"
          python3 scripts/sync_core.py check . --core "$RUNNER_TEMP/core"
      - name: Behavioral tests
        env:
          CI_TEST_JOBS: '4'
          CI_FORBID_SKIP: 'PowerShell .*(not installed|required)|needs PowerShell|requires PowerShell|no PowerShell found'
        run: python3 scripts/ci_run_tests.py
      - name: Validate the example configuration
        run: |
          PROJECT_ENV_FILE=.env.example bash -c 'source scripts/load_env.sh "$PROJECT_ENV_FILE"'
      - name: JSON and line-ending checks
        run: |
          python3 -c 'import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path("apps").rglob("*.json")]'
          ! grep -RIl $'\r' --include='*.apx' --include='*.sql' --include='*.json' --include='*.sh' --include='*.ps1' .

  # A second Linux run on the newest Python 3.x, beside the required `offline` job (3.10), so that a newer
  # interpreter cannot break the suite unnoticed. It is kept out of a matrix so that `offline` keeps its name.
  offline-latest-python:
    name: offline (latest Python 3.x)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Python syntax
        run: |
          python3 -m compileall -q scripts/ tools/ tests/
      - name: Install Ruff
        # Lint runs in `offline`. Ruff is installed here only because tests/test_pre_push_check.py runs
        # scripts/pre_push_check.py, which fails without it.
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'ruff>=0.5'
      - name: Behavioral tests
        env:
          CI_TEST_JOBS: '4'
          CI_FORBID_SKIP: 'PowerShell .*(not installed|required)|needs PowerShell|requires PowerShell|no PowerShell found'
        run: python3 scripts/ci_run_tests.py

  graphify:
    name: graphify (pinned set, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up the project-isolated Graphify environment
        # setup_graphify_apx.py builds .venv-graphify from tools/graphify/requirements.txt (the exact pinned set, which
        # needs Python 3.12) and patches it with the project APEXlang extractor, so a pin move that breaks the patch
        # fails here. Its bin directory goes on PATH because the Graphify pipeline tests look for `graphify` there.
        run: |
          python3 scripts/setup_graphify_apx.py
          echo "$GITHUB_WORKSPACE/.venv-graphify/bin" >> "$GITHUB_PATH"
      - name: Graphify tests
        # Only the Graphify test modules run, and none of them may skip: with Graphify installed a skip means the
        # pipeline did not run.
        env:
          CI_FORBID_SKIP: '.*'
        run: python3 scripts/ci_run_tests.py -p 'test_*graphify*.py'

  windows-tests:
    name: windows-offline (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # ASHARIF 2026-11-26: one Windows runner is saturated by the suite (about 45 minutes of test time on 4
    # workers took 23 minutes), so three runners share it; scripts/ci_run_tests.py --shard deals the modules.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Python syntax
        if: matrix.shard == 1
        run: python -m compileall -q scripts/ tools/ tests/
      - name: Ruff
        if: matrix.shard == 1
        run: |
          python -m pip install --disable-pip-version-check --no-input 'ruff>=0.5'
          ruff check scripts tools tests
      - name: Shell syntax
        if: matrix.shard == 1
        shell: bash
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: PowerShell parse
        if: matrix.shard == 1
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path scripts -Filter '*.ps1')
          if ($files.Count -eq 0) { Write-Host 'no scripts/*.ps1 found'; exit 1 }
          $bad = 0
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            foreach ($problem in $errors) {
              Write-Host ('{0}:{1}: {2}' -f $file.FullName, $problem.Extent.StartLineNumber, $problem.Message)
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Use the long form of the temp directory
        # The runner's temp directory is a short 8.3 name (RUNNER~1) that resolve() expands, which broke
        # path comparisons in tests three times. Keep the runner's own (private) directory, with its long name.
        run: |
          @'
          import os
          import pathlib

          long_temp = str(pathlib.Path(os.environ["TEMP"]).resolve())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TEMP={long_temp}\nTMP={long_temp}\n")
          print("TEMP is now", long_temp)
          '@ | python -
      - name: Behavioral tests
        env:
          CI_TEST_JOBS: '2'
          CI_TEST_SHARD: ${{ matrix.shard }}/3
          CI_FORBID_SKIP: 'PowerShell .*(not installed|required)|needs PowerShell|requires PowerShell|no PowerShell found'
        run: python scripts/ci_run_tests.py
      - name: Validate the example configuration
        if: matrix.shard == 1
        shell: bash
        run: |
          export PROJECT_ENV_FILE=.env.example
          bash -c 'source scripts/load_env.sh "$PROJECT_ENV_FILE"'
      - name: JSON and line-ending checks
        if: matrix.shard == 1
        run: |
          @'
          import json
          from pathlib import Path

          for path in Path("apps").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          suffixes = {".apx", ".sql", ".json", ".sh", ".ps1"}
          offenders = [str(path) for path in Path(".").rglob("*")
                       if path.is_file() and path.suffix.lower() in suffixes
                       and b"\r" in path.read_bytes()]
          if offenders:
              raise SystemExit("CRLF files found: " + ", ".join(offenders))
          '@ | python -


  # The required check: passes when every shard passed, or when the shards were skipped on purpose.
  windows-offline:
    needs: [changes, windows-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Shards passed or were skipped on purpose
        env:
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          SHARDS: ${{ needs.windows-tests.result }}
        run: |
          echo "changes=$CHANGES full=$FULL windows shards=$SHARDS"
          if [ "$CHANGES" = success ] && { [ "$SHARDS" = success ] || { [ "$FULL" != true ] && [ "$SHARDS" = skipped ]; }; }; then
            exit 0
          fi
          echo "::error::the Windows shards did not all pass"
          exit 1
  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Darwin exclusive directory installation tests
        run: python3 -m unittest discover -s tests -p 'test_directory_install.py' -v

  # The other jobs parse and test PowerShell only as pwsh 7. This job runs the readiness script's fast steps under
  # Windows PowerShell 5.1 (`shell: powershell`), the engine the team uses; the full suite is in `windows-offline`.
  # The environment step fails if the engine is not 5.1. A child powershell.exe makes the script's exit code the result.
  windows-powershell-51:
    name: Windows PowerShell 5.1 readiness (fast steps)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: windows_check.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows_check.ps1 -Skip tests,pre-push
          exit $LASTEXITCODE
