name: windows-ords-stress

on: pull_request

permissions:
  contents: read

jobs:
  status-loss:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [exec_trap_return, exec_trap_exit, noexec_trap_return]
        launcher: [bin, usr]
    steps:
      - name: Count wrong exit statuses
        shell: bash
        run: |
          mkdir -p lab && cd lab
          variant='${{ matrix.variant }}'
          # parent: like scripts/team.sh (exec into the script, or run it as a child)
          if [ "$variant" = noexec_trap_return ]; then
            printf '#!/usr/bin/env bash\n"$(dirname "$0")/child.sh"\nexit $?\n' > parent.sh
          else
            printf '#!/usr/bin/env bash\nexec "$(dirname "$0")/child.sh"\n' > parent.sh
          fi
          # child: like scripts/backup_db.sh
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            echo 'STAGING="$(mktemp -d "$(dirname "$0")/stage.XXXXXX")"'
            if [ "$variant" != exec_notrap_return ]; then
              echo 'cleanup() { rm -rf -- "$STAGING"; }'
              echo 'trap cleanup EXIT'
              echo "trap 'exit 130' INT"
              echo "trap 'exit 143' TERM HUP"
            fi
            echo 'for i in $(seq 1 40); do echo "payload $i" > "$STAGING/file-$i.txt"; done'
            echo 'mkdir -p "$STAGING/sub/deeper"; echo x > "$STAGING/sub/deeper/f.txt"'
            if [ "$variant" = exec_trap_exit ]; then
              echo 'run_scope() { echo "export verification failed: refused" >&2; echo "the mirror was not replaced" >&2; exit 2; }'
              echo 'run_scope'
            elif [ "$variant" = exec_trap_python ]; then
              echo 'run_scope() { python -c "import sys; print(\"verification failed\"); sys.exit(2)" || { echo "the mirror was not replaced" >&2; return 2; }; }'
              echo 'run_scope || exit $?'
            elif [ "$variant" = exec_trap_rm_slow ]; then
              echo 'for i in $(seq 1 600); do echo "more $i" > "$STAGING/more-$i.txt"; done'
              echo 'run_scope() { echo "export verification failed: refused" >&2; echo "the mirror was not replaced" >&2; return 2; }'
              echo 'run_scope || exit $?'
            else
              echo 'run_scope() { echo "export verification failed: refused" >&2; echo "the mirror was not replaced" >&2; return 2; }'
              echo 'run_scope || exit $?'
            fi
            echo 'exit 0'
          } > child.sh
          chmod +x parent.sh child.sh
          cat > caller.py <<'PY'
          import subprocess, sys, threading, shutil
          import os
          bash = os.path.join(r"C:\Program Files\Git", "${{ matrix.launcher }}", "bash.exe") if "${{ matrix.launcher }}" == "bin" else os.path.join(r"C:\Program Files\Git\usr\bin", "bash.exe")
          assert os.path.isfile(bash), bash
          wrong = []
          lock = threading.Lock()
          def worker(wid):
              for n in range(150):
                  result = subprocess.run([bash, "./parent.sh"], capture_output=True, text=True)
                  if result.returncode != 2:
                      with lock:
                          wrong.append((wid, n, result.returncode, result.stderr[-200:]))
          threads = [threading.Thread(target=worker, args=(i,)) for i in range(4)]
          [t.start() for t in threads]
          [t.join() for t in threads]
          for item in wrong:
              print("wrong exit status:", item)
          print(f"variant ${{ matrix.variant }} launcher ${{ matrix.launcher }}: total=600 wrong_status={len(wrong)} bash={bash}")
          sys.exit(1 if wrong else 0)
          PY
          python caller.py
